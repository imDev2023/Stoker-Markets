name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes the rule that keeps @launchpad/chain and the Raydium SDK out of the web app (ADR 0003).
      - run: pnpm lint
      - run: pnpm typecheck
