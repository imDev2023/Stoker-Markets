name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run, to see what GitHub answers when no run ever starts on its own.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes the rule that keeps @launchpad/chain and the Raydium SDK out of the web app (ADR 0003).
      - run: pnpm lint
      - run: pnpm typecheck

  # The black-box backend suite: the API under wrangler, a real Postgres, and the local chain on Surfpool (the Raydium
  # devnet programs from fixtures, embedded in the test process; see tools/localnet), since runners have no
  # solana-test-validator.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:backend
        env:
          # Each suite makes its own throwaway database on this server (tools/stack).
          STACK_DATABASE_URL: postgres://test:test@127.0.0.1:5432/postgres
          LOCALNET_RUNTIME: surfpool
          WRANGLER_SEND_METRICS: "false"
