<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" aria-label="Stoker">
  <!--
    The mark (owner, 2026-10-09): E2, the heating ring, a thick ring in Graphite's heat ramp with a soft bloom on the
    dark graphite tile. The tile stays dark in both modes, so the mark is one image everywhere. The vector is the
    marketing folder's brand/mark-e2.svg, as the mark candidate page drew it.
  -->
  <defs>
    <linearGradient id="heat" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a2a"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="#141312"/>
  <circle cx="16" cy="16" r="8.6" fill="none" stroke="url(#heat)" stroke-width="4.2" filter="url(#bloom)" opacity="0.75"/>
  <circle cx="16" cy="16" r="8.6" fill="none" stroke="url(#heat)" stroke-width="4.2"/>
</svg>
