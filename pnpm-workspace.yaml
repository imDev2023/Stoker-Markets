packages:
  - apps/*
  - packages/*
  - tools/*
  - tests/*
allowBuilds:
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  utf-8-validate: true
  workerd: true
peerDependencyRules:
  allowedVersions:
    # @solana/codecs declares typescript ^5 for its types only; the workspace is pinned to 6 (see CLAUDE.md).
    typescript: "6"
    # ws@7 (via jayson in @solana/web3.js) asks for ^5; version 6 keeps the same API.
    ws>utf-8-validate: "6"
